{% extends "base.html" %}

{% block title %}Administrator Sign In - BioAttendAI{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
        
        <div class="card-header bg-dark text-white text-center py-4 border-0">
          <div class="mb-2">
            <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-25 text-primary mb-1">
              <i class="bi bi-shield-lock-fill display-5"></i>
            </div>
          </div>
          <h4 class="fw-bold mb-0">Admin Authentication</h4>
          <p class="text-white-50 small mb-0">Secure Biometric Attendance Portal</p>
        </div>
        
        <div class="card-body p-4 p-md-5">
          <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
            
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold small text-muted text-uppercase">Username</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="e.g. admin" value="admin" required autofocus>
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label fw-semibold small text-muted text-uppercase">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                <input type="password" class="form-control border-start-0 border-end-0" id="password" name="password" placeholder="••••••••" value="admin123" required>
                <button type="button" class="btn btn-light border border-start-0 text-muted" id="togglePasswordBtn" title="Show/Hide Password">
                  <i class="bi bi-eye" id="passwordEyeIcon"></i>
                </button>
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mb-3 shadow-sm">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
            </button>
          </form>

          <!-- Quick Fill Demo Banner -->
          <div class="alert alert-info py-2 px-3 small border-0 bg-primary-subtle text-primary rounded-3 d-flex justify-content-between align-items-center mb-0">
            <div>
              <i class="bi bi-info-circle-fill me-1"></i> Demo: <code>admin</code> / <code>admin123</code>
            </div>
            <button type="button" class="btn btn-sm btn-link p-0 text-decoration-none fw-semibold" id="fillDemoBtn">
              Auto-fill
            </button>
          </div>
        </div>

        <div class="card-footer bg-light text-center py-3 border-top">
          <a href="{{ url_for('attendance.scan_page') }}" class="text-decoration-none small text-muted">
            <i class="bi bi-arrow-left me-1"></i> Return to Student Attendance Kiosk
          </a>
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const passwordInput = document.getElementById('password');
  const toggleBtn = document.getElementById('togglePasswordBtn');
  const eyeIcon = document.getElementById('passwordEyeIcon');
  const fillDemoBtn = document.getElementById('fillDemoBtn');

  toggleBtn.addEventListener('click', () => {
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.className = 'bi bi-eye-slash';
    } else {
      passwordInput.type = 'password';
      eyeIcon.className = 'bi bi-eye';
    }
  });

  fillDemoBtn.addEventListener('click', () => {
    document.getElementById('username').value = 'admin';
    passwordInput.value = 'admin123';
  });
</script>
{% endblock %}
