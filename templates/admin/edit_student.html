{% extends "base.html" %}

{% block title %}Edit Student - BioAttendAI{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="card shadow-sm">
        <div class="card-header py-3 d-flex justify-content-between align-items-center">
          <h5 class="fw-bold mb-0"><i class="bi bi-pencil-square me-2 text-primary"></i>Edit Student Information</h5>
          <a href="{{ url_for('admin.student_detail', student_id=student.id) }}" class="btn btn-sm btn-outline-secondary">
            Cancel
          </a>
        </div>
        <div class="card-body p-4">
          <form method="POST">
            <div class="mb-3">
              <label for="register_number" class="form-label fw-semibold">Student ID / Register Number</label>
              <input type="text" class="form-control text-uppercase" id="register_number" name="register_number" value="{{ student.register_number }}" required>
            </div>

            <div class="mb-3">
              <label for="full_name" class="form-label fw-semibold">Full Name</label>
              <input type="text" class="form-control" id="full_name" name="full_name" value="{{ student.full_name }}" required>
            </div>

            <div class="mb-3">
              <label for="department" class="form-label fw-semibold">Department</label>
              <input type="text" class="form-control" id="department" name="department" value="{{ student.department }}" required>
            </div>

            <div class="mb-3">
              <label for="class_year" class="form-label fw-semibold">Class / Year</label>
              <input type="text" class="form-control" id="class_year" name="class_year" value="{{ student.class_year }}" required>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">Email Address</label>
              <input type="email" class="form-control" id="email" name="email" value="{{ student.email or '' }}">
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold">Enrollment Status</label>
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="active_status" name="active_status" value="1" {% if student.active_status %}checked{% endif %}>
                <label class="form-check-label" for="active_status">Active (Eligible for Attendance verification)</label>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2 border-top pt-3">
              <a href="{{ url_for('admin.student_detail', student_id=student.id) }}" class="btn btn-light">Cancel</a>
              <button type="submit" class="btn btn-primary px-4"><i class="bi bi-save me-1"></i> Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
